services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
    volumes:
      - ./frontend/.env.production:/app/.env.production
    networks:
      - dabu-network

networks:
  dabu-network:
    driver: bridge
